<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR DEFENDERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div id="p1-stats" class="player-stats">
                <span class="player-label">P1</span>
                <div class="lives" id="p1-lives">♥♥♥♥♥</div>
                <div class="score" id="p1-score">000000</div>
                <div class="power-status" id="p1-power"></div>
            </div>
            <div id="center-stats">
                <div id="level-display">LEVEL 1</div>
                <div id="boss-bar-container" class="hidden">
                    <div id="boss-name-display">BOSS</div>
                    <div id="boss-hp-outer"><div id="boss-hp-inner"></div></div>
                </div>
            </div>
            <div id="p2-stats" class="player-stats">
                <div class="score" id="p2-score">000000</div>
                <div class="lives" id="p2-lives">♥♥♥♥♥</div>
                <div class="power-status" id="p2-power"></div>
                <span class="player-label">P2</span>
            </div>
        </div>

        <!-- Menu principal -->
        <div id="main-menu" class="overlay">
            <h1>STAR<br>DEFENDERS</h1>

            <div class="level-selector">
                <button id="btn-lvl-down" class="arrow-btn">◀</button>
                <div class="level-name">
                    <div class="level-label">NIVEAU</div>
                    <div id="level-select-num">1</div>
                </div>
                <button id="btn-lvl-up" class="arrow-btn">▶</button>
            </div>

            <div class="menu-btns">
                <button id="btn-start">▶ 1 JOUEUR</button>
                <button id="btn-coop">👥 COOPÉRATION</button>
            </div>
            <p class="controls-info">P1 : ZQSD + Espace | Bouclier : E &nbsp;|&nbsp; P2 : Flèches + Entrée | Bouclier : Shift</p>
        </div>

        <!-- Menu Pause -->
        <div id="pause-menu" class="overlay hidden">
            <h2 class="title-pause">PAUSE</h2>
            <p id="pause-info" class="pause-info">NIVEAU 1 · 1 JOUEUR</p>
            <div class="menu-btns">
                <button id="btn-resume">▶ REPRENDRE</button>
                <button id="btn-toggle-mode">👥 PASSER EN 2 JOUEURS</button>
                <button id="btn-restart-pause">↩ RECOMMENCER</button>
                <button id="btn-to-menu">🏠 MENU PRINCIPAL</button>
            </div>
            <p class="controls-info">ECHAP ou P pour mettre en pause</p>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p class="score-final">Score : <span id="final-score">0</span></p>
            <button id="btn-restart">↩ REJOUER</button>
        </div>

        <!-- Victory -->
        <div id="victory" class="overlay hidden">
            <h2 class="victory-title">VICTOIRE !</h2>
            <p class="score-final">Score : <span id="victory-score">0</span></p>
            <p class="victory-sub">Tous les niveaux complétés !</p>
            <button id="btn-victory-menu">🏠 MENU PRINCIPAL</button>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls" class="mobile-only">
            <div id="dpad">
                <button class="dpad-btn" id="dpad-up" data-dir="up">▲</button>
                <button class="dpad-btn" id="dpad-left" data-dir="left">◀</button>
                <button class="dpad-btn" id="dpad-right" data-dir="right">▶</button>
                <button class="dpad-btn" id="dpad-down" data-dir="down">▼</button>
            </div>
            <div id="action-buttons">
                <button class="action-btn" id="btn-shield-mobile">🛡</button>
                <button class="action-btn" id="btn-fire">🔥</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
